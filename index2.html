  <!-- Font: Be Vietnam Pro (gần giống Poppins, đủ dấu tiếng Việt) + Noto Sans SC (tiếng Trung) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Bảng màu theo phong cách Healthcoach: đổi ở đây là cả trang đổi theo
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Be Vietnam Pro"', '"Noto Sans SC"', '"PingFang SC"', '"Microsoft YaHei"', "ui-sans-serif", "system-ui", "sans-serif"],
          },
          colors: {
            primary: { DEFAULT: "#1089ff", dark: "#006fdc", light: "#e7f2ff" },
            leaf: { DEFAULT: "#a3cb4c", dark: "#7fa52e", light: "#f1f7e3" },
            dark: "#131719",
            light: "#f8f9fd",
            body: "#808080",
            heading: "#333333",
          },
          boxShadow: {
            card: "0 24px 48px -13px rgba(0, 0, 0, 0.12)",
          },
        },
      },
    };

  <style type="text/tailwindcss">
    html { scroll-padding-top: 5rem; }
    body { @apply bg-white font-sans text-[15px] leading-relaxed text-body antialiased; }

    /* Đặt trong @layer components để class tiện ích (hidden, bg-*, px-*…) ghi đè được */
    @layer components {
      .container-x { @apply mx-auto w-full max-w-6xl px-4 sm:px-6; }
      .section { @apply py-16 md:py-24; }
      .eyebrow { @apply mb-2 block text-xs font-semibold uppercase tracking-[0.2em] text-primary; }
      .heading { @apply text-2xl font-semibold leading-snug text-heading md:text-4xl; text-wrap: balance; }

      .btn { @apply inline-flex items-center justify-center gap-2 whitespace-nowrap rounded px-6 py-3.5 text-xs font-medium uppercase tracking-[0.15em] transition duration-300; }
      .btn-primary { @apply btn bg-primary text-white hover:bg-primary-dark; }
      .btn-outline-primary { @apply btn border border-primary text-primary hover:bg-primary hover:text-white; }
      .btn-outline-white { @apply btn border border-white text-white hover:bg-white hover:text-heading; }

      .card { @apply rounded bg-white shadow-card; }
      .field { @apply h-12 w-full rounded border border-gray-200 bg-white px-4 text-sm text-heading outline-none transition placeholder:text-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/20; }
      textarea.field { @apply h-auto py-3; }
      .field.invalid { @apply border-red-400; }

      .nav-link { @apply relative py-7 text-sm text-gray-600 transition hover:text-primary; }
      .nav-link.active { @apply text-primary; }
      .nav-link.active::after { content: ""; @apply absolute inset-x-0 bottom-0 h-0.5 bg-primary; }
      .mobile-link { @apply border-b border-gray-100 py-3 text-sm text-gray-700 hover:text-primary; }

      .lang-btn { @apply whitespace-nowrap rounded px-2 py-0.5 text-[11px] font-semibold text-white/80 transition hover:text-white; }
      .lang-btn.active { @apply bg-white text-primary-dark; }
      .social { @apply grid h-7 w-7 place-items-center text-white/90 transition hover:text-white; }
    }
  </style>
</head>

        <a href="https://t.me/fitcoach" data-link="telegram" target="_blank" rel="noopener noreferrer" class="social hidden sm:grid" aria-label="Telegram">

          <button type="button" class="lang-btn" data-lang="zh" lang="zh-CN">中文</button>

  <!-- ===================== NAVBAR ===================== -->

  <main>

    <section id="top" class="relative overflow-hidden bg-dark">
      <!-- Các slide chồng lên nhau trong cùng 1 ô grid: chiều cao = slide cao nhất, không bị cắt chữ -->
      <div id="heroSlides" class="grid min-h-[640px] md:min-h-[760px]">
       <div class="slide relative isolate col-start-1 row-start-1 flex items-center transition-opacity duration-1000">
        <img src="https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=1920&q=80" alt="" data-i18n-alt="hero.imgAlt" class="absolute inset-0 -z-20 h-full w-full object-cover" />
        <div class="absolute inset-0 -z-10 bg-gradient-to-r from-black/75 via-black/45 to-black/10"></div>
        <div class="container-x pb-44 pt-12 md:pb-52">
        <div class="max-w-2xl">
          <span class="eyebrow text-[13px] text-primary" data-i18n="hero.badge"></span>
          <h1 class="mt-3 text-4xl font-light leading-tight text-white sm:text-5xl lg:text-6xl">
            <span data-i18n="hero.line1"></span>
            <span data-i18n="hero.line2"></span>
            <span class="mt-2 block text-2xl font-normal text-leaf sm:text-3xl" data-i18n="hero.highlight"></span>

          <div class="mt-8 flex flex-col gap-3 sm:flex-row">

            <a href="#ket-qua" class="btn-outline-white px-8 py-4" data-i18n="hero.ctaSecondary"></a>
          </div>
          <ul id="heroChecks" class="mt-8 flex flex-wrap gap-x-6 gap-y-2 text-sm text-white/85"></ul>
        </div>
        </div>
       </div>
       <div id="heroExtra" class="contents"></div>
      </div>
      <!-- Chấm chuyển slide -->
      <div id="heroDots" class="absolute bottom-40 left-1/2 z-10 flex -translate-x-1/2 gap-2 md:bottom-48"></div>
    </section>

      quote: '<svg class="h-8 w-8" fill="currentColor" viewBox="0 0 24 24"><path d="M10 7H6a3 3 0 0 0-3 3v4h4v4l3-4v-7Zm11 0h-4a3 3 0 0 0-3 3v4h4v4l3-4v-7Z"/></svg>',
    };
    const icon = (name, cls) => ICONS[name].replace("ICON", cls);

    // Giá kiểu Healthcoach: số lớn nét mảnh + đơn vị tiền nhỏ phía trên
    const money = (n, big = true) => {
      const m = T.money;
      const num = n.toLocaleString(m.locale);
      if (!big) return m.before ? `${m.cur}${num}` : `${num} ${m.cur}`;
      const cur = `<sup class="relative -top-4 text-sm font-normal text-body">${m.cur}</sup>`;
      const val = `<span class="text-4xl font-light text-heading md:text-[2.6rem]">${num}</span>`;
      return m.before ? `${cur} ${val}` : `${val} ${cur}`;
    };

    let lang = CONFIG.DEFAULT_LANG;
    let T = I18N[lang];

    /* ============================ RENDER ============================ */
    function renderLists() {
      $("#heroChecks").innerHTML = T.hero.checks
        .map((t) => `<li class="flex items-center gap-2">${icon("check", "h-4 w-4 text-leaf")}${t}</li>`)
        .join("");

      $("#servicesGrid").innerHTML = T.services.items
        .map(
          (s, i) => `
          <article class="card group flex flex-col p-4">
            <div class="overflow-hidden">
              <img src="${SERVICE_IMAGES[i]}" alt="${s.title}" class="h-44 w-full object-cover transition duration-500 group-hover:scale-105" />
            </div>
            <div class="flex flex-1 flex-col px-3 pb-4 pt-6 text-center">
              <h3 class="text-lg font-normal text-heading">${s.title}</h3>
              <p class="mt-2 flex-1 text-sm leading-relaxed">${s.short}</p>
              <a href="#dang-ky" class="btn-outline-primary mx-auto mt-5 px-5 py-2.5 text-[11px]">${T.services.more}</a>
            </div>
          </article>`,
        )
        .join("");

      // Slide 2-3 của hero
      $("#heroExtra").innerHTML = T.hero.slides
        .map(
          (s, i) => `
          <div class="slide relative isolate col-start-1 row-start-1 flex items-center opacity-0 transition-opacity duration-1000" aria-hidden="true">
            <img src="${HERO_IMAGES[i]}" alt="" class="absolute inset-0 -z-20 h-full w-full object-cover" />
            <div class="absolute inset-0 -z-10 bg-gradient-to-r from-black/75 via-black/45 to-black/10"></div>
            <div class="container-x pb-44 pt-12 md:pb-52">
              <div class="max-w-2xl">
                <span class="eyebrow text-[13px] text-primary">${s.eyebrow}</span>
                <h2 class="mt-3 text-4xl font-light leading-tight text-white sm:text-5xl lg:text-6xl">${s.title}</h2>
                <p class="mt-6 max-w-xl text-base text-white/80 sm:text-lg">${s.sub}</p>
                <div class="mt-8 flex flex-col gap-3 sm:flex-row">
                  <a href="#dang-ky" class="btn-primary px-8 py-4" tabindex="-1">${T.hero.ctaPrimary}</a>
                  <a href="#ket-qua" class="btn-outline-white px-8 py-4" tabindex="-1">${T.hero.ctaSecondary}</a>
                </div>
              </div>
            </div>
          </div>`,
        )
        .join("");
      showSlide(currentSlide);

      $("#footerServices").innerHTML = T.services.items
        .map((s) => `<li><a href="#dich-vu" class="hover:text-white">${s.title}</a></li>`)
        .join("");

      $("#credentials").innerHTML = T.about.credentials
        .map((c) => `<li class="flex items-start gap-2.5">${icon("check", "mt-1 h-4 w-4 shrink-0 text-leaf")}<span>${c}</span></li>`)
        .join("");

      const counters = [["8+", T.about.years], ...T.hero.stats];
      $("#counters").innerHTML = counters
        .map(([v, l]) => `<div><p class="text-3xl font-light text-primary md:text-4xl">${v}</p><p class="mt-1 text-xs leading-snug">${l}</p></div>`)
        .join("");

      $("#method").innerHTML = T.about.method
        .map(([t, d]) => `<div class="border-l-2 border-leaf pl-3"><p class="font-medium text-heading">${t}</p><p class="mt-1 text-xs leading-snug">${d}</p></div>`)
        .join("");

      // Before/After: input range trong suốt phủ lên ảnh, kéo được bằng chuột, cảm ứng, bàn phím
      $("#resultsGrid").innerHTML = T.results.items
        .map((r, i) => {
          const img = RESULT_IMAGES[i];
          return `
          <figure class="card overflow-hidden">
            <div class="ba relative aspect-[4/5] select-none overflow-hidden bg-gray-200">
              <img src="${img.after}" alt="${r.name} - ${T.results.after}" loading="lazy" class="absolute inset-0 h-full w-full object-cover" />
              <div class="ba-before absolute inset-0" style="clip-path: inset(0 50% 0 0)">
                <img src="${img.before}" alt="${r.name} - ${T.results.before}" loading="lazy" class="h-full w-full object-cover brightness-90 grayscale" />
              </div>
              <span class="absolute left-3 top-3 rounded bg-dark/80 px-2.5 py-1 text-[11px] font-medium uppercase tracking-widest text-white">${T.results.before}</span>
              <span class="absolute right-3 top-3 rounded bg-primary px-2.5 py-1 text-[11px] font-medium uppercase tracking-widest text-white">${T.results.after}</span>
              <div class="ba-line pointer-events-none absolute inset-y-0 w-0.5 bg-white" style="left: 50%">
                <span class="absolute left-1/2 top-1/2 grid h-10 w-10 -translate-x-1/2 -translate-y-1/2 place-items-center rounded-full bg-white text-sm font-bold text-primary shadow-lg">⇆</span>
              </div>
              <input type="range" min="0" max="100" value="50" aria-label="${T.results.slider}" class="absolute inset-0 h-full w-full cursor-ew-resize opacity-0" />
            </div>
            <figcaption class="p-6">
              <div class="flex items-center justify-between gap-2">
                <p class="text-lg font-medium text-heading">${r.name}</p>
                <span class="whitespace-nowrap text-xs uppercase tracking-widest text-primary">${r.duration}</span>
              </div>
              <p class="text-sm">${r.info}</p>
              <div class="mt-4 flex flex-wrap gap-2">
                ${r.stats.map((s) => `<span class="rounded bg-leaf-light px-3 py-1 text-sm font-semibold text-leaf-dark">${s}</span>`).join("")}
              </div>
            </figcaption>
          </figure>`;
        })
        .join("");

      $$(".ba").forEach((box) => {
        const range = box.querySelector("input");
        range.addEventListener("input", () => {
          box.querySelector(".ba-before").style.clipPath = `inset(0 ${100 - range.value}% 0 0)`;
          box.querySelector(".ba-line").style.left = `${range.value}%`;
        });
      });

      $("#storySlides").innerHTML = T.stories.items
        .map(
          (s, i) => `
          <article class="story col-start-1 row-start-1 grid overflow-hidden bg-white shadow-card transition-opacity duration-700 md:grid-cols-2">
            <img src="${STORY_IMAGES[i]}" alt="${s.name}" loading="lazy" class="aspect-[4/3] h-full w-full object-cover md:aspect-auto md:min-h-[440px]" />
            <div class="flex flex-col justify-center p-8 md:p-12">
              <span class="text-primary/30">${ICONS.quote}</span>
              <span class="mt-3 inline-flex self-start rounded bg-leaf-light px-3 py-1 text-sm font-semibold text-leaf-dark">${s.result}</span>
              <p class="mt-5 text-sm leading-relaxed">${s.p1}</p>
              <p class="mt-3 text-sm leading-relaxed">${s.p2}</p>
              <div class="mt-8 flex items-center justify-between gap-3">
                <div>
                  <p class="font-medium text-heading">${s.name}</p>
                  <p class="text-sm">${s.role}</p>
                </div>
                <span class="flex text-leaf">${ICONS.star.repeat(5)}</span>
              </div>
            </div>
          </article>`,
        )
        .join("");
      showStory(currentStory);

      $("#pricingGrid").innerHTML = PLANS.map((p, i) => {
        const tp = T.pricing.plans[i];
        const f = p.featured;
        return `
          <article class="card relative flex flex-col px-8 py-10 text-center ${f ? "border-t-4 border-primary lg:-my-4 lg:py-14" : ""}">
            ${tp.badge ? `<span class="absolute -top-4 left-1/2 -translate-x-1/2 whitespace-nowrap rounded bg-leaf px-4 py-1 text-[11px] font-semibold uppercase tracking-widest text-white">${tp.badge}</span>` : ""}
            <h3 class="text-2xl font-normal text-heading">${tp.name}</h3>
            <p class="mt-2 text-sm">${tp.tagline}</p>
            <div class="mt-7">
              ${p.oldPrice ? `<span class="block text-sm text-gray-400 line-through">${money(p.oldPrice, false)}</span>` : ""}
              <span class="relative inline-block">${money(p.price)}</span>
              <span class="block text-sm">${T.period(p.months)}</span>
            </div>
            <ul class="mx-auto mb-8 mt-8 flex-1 space-y-3 text-left text-sm">
              ${tp.features.map((x) => `<li class="flex items-start gap-2.5">${icon("check", "mt-0.5 h-4 w-4 shrink-0 text-leaf")}${x}</li>`).join("")}
            </ul>
            <button type="button" data-plan="${p.id}" class="choose-plan ${f ? "btn-primary" : "btn-outline-primary"} mx-auto px-8 py-4">${T.pricing.choose}</button>
          </article>`;
      }).join("");

      $$(".choose-plan").forEach((btn) =>
        btn.addEventListener("click", () => {
          $("#plan").value = btn.dataset.plan;
          $("#dang-ky").scrollIntoView({ behavior: "smooth" });
        }),
      );

      $("#stepsGrid").innerHTML = T.how.steps
        .map(
          (s, i) => `
          <div class="text-center">
            <span class="mx-auto grid h-16 w-16 place-items-center rounded-full bg-leaf text-white shadow-[0_10px_25px_-5px_rgba(163,203,76,0.6)]">
              <svg class="h-8 w-8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">${STEP_ICONS[i]}</svg>
            </span>
            <h3 class="mt-6 text-lg font-normal text-heading">${s.title}</h3>
            <p class="mx-auto mt-2 max-w-[15rem] text-sm leading-relaxed">${s.desc}</p>
          </div>`,
        )
        .join("");

      renderBlog();

      $("#offerList").innerHTML = T.lead.offers
        .map((t) => `<li class="flex items-center gap-3"><span class="grid h-6 w-6 shrink-0 place-items-center rounded-full bg-leaf text-white">${icon("check", "h-3.5 w-3.5")}</span><span class="text-heading">${t}</span></li>`)
        .join("");

      // Select: giá trị là chỉ số / id nên giữ nguyên lựa chọn khi đổi ngôn ngữ
      const goalSel = $("#goal");
      const planSel = $("#plan");
      const goalVal = goalSel.value || "0";
      const planVal = planSel.value;
      goalSel.innerHTML = T.form.goals.map((g, i) => `<option value="${i}">${g}</option>`).join("");
      planSel.innerHTML =
        `<option value="">${T.form.planNone}</option>` +
        PLANS.map((p, i) => `<option value="${p.id}">${T.pricing.plans[i].name}</option>`).join("");
      goalSel.value = goalVal;
      planSel.value = planVal;

      // Giới tính và mức vận động: giá trị cố định (dùng để tính BMR/TDEE trên trang admin)
      const sexSel = $("#sex");
      const actSel = $("#activity");
      const sexVal = sexSel.value || "female";
      const actVal = actSel.value || "1.375";
      sexSel.innerHTML = ["female", "male"].map((v, i) => `<option value="${v}">${T.form.sexOpts[i]}</option>`).join("");
      actSel.innerHTML = ["1.2", "1.375", "1.55", "1.725"].map((v, i) => `<option value="${v}">${T.form.activityOpts[i]}</option>`).join("");
      sexSel.value = sexVal;
      actSel.value = actVal;
    }

    /* ============================ BLOG ============================ */
    // Bài admin đã đăng (ưu tiên ngôn ngữ đang xem → tiếng Anh → tiếng Việt), không có thì hiện bài mẫu
    function blogItems() {
      if (remotePosts && remotePosts.length) {
        return remotePosts.slice(0, 3).map((p) => {
          const f = p.i18n[lang] || p.i18n.en || p.i18n.vi || Object.values(p.i18n)[0] || {};
          return { id: p.id, image: p.image || BLOG_FALLBACK_IMAGE, date: p.publishedAt, title: f.title || "", excerpt: f.excerpt || "", content: f.content || f.excerpt || "" };
        });
      }
      return BLOG_POSTS.map((b, i) => ({ id: `sample-${i}`, image: b.image, date: b.date, title: T.blog.posts[i].title, excerpt: T.blog.posts[i].excerpt, content: T.blog.posts[i].excerpt }));
    }

    const formatDate = (d) => new Date(d).toLocaleDateString(T.htmlLang, { day: "numeric", month: "long", year: "numeric" });

    function renderBlog() {
      $("#blogGrid").innerHTML = blogItems()
        .map(
          (b) => `
          <article class="group">
            <button type="button" data-post="${b.id}" class="open-post block w-full overflow-hidden rounded">
              <img src="${esc(b.image)}" alt="${esc(b.title)}" loading="lazy" class="aspect-[7/5] w-full object-cover transition duration-500 group-hover:scale-105" />
            </button>
            <div class="mt-5 flex flex-wrap items-center gap-x-3 gap-y-1 text-[13px]">
              <span>${formatDate(b.date)}</span>
              <span class="text-leaf">${T.blog.author}</span>
            </div>
            <h3 class="mt-3 text-lg font-normal leading-snug text-heading transition group-hover:text-primary md:text-xl">
              <button type="button" data-post="${b.id}" class="open-post text-left">${esc(b.title)}</button>
            </h3>
            <p class="mt-2 text-sm">${esc(b.excerpt)}</p>
            <button type="button" data-post="${b.id}" class="open-post mt-3 inline-block text-xs font-medium uppercase tracking-[0.15em] text-primary hover:text-primary-dark">${T.blog.readMore} →</button>
          </article>`,
        )
        .join("");
    }

    // Cửa sổ đọc bài đầy đủ
    function openPostModal(id) {
      const b = blogItems().find((x) => x.id === id);
      if (!b) return;
      $("#postModalImg").src = b.image;
      $("#postModalImg").alt = b.title;
      $("#postModalMeta").textContent = `${formatDate(b.date)} · ${T.blog.author}`;
      $("#postModalTitle").textContent = b.title;
      $("#postModalBody").innerHTML = b.content
        .split(/\n\s*\n/)
        .map((para) => `<p>${esc(para).replace(/\n/g, "<br>")}</p>`)
        .join("");
      $("#postModal").classList.remove("hidden");
      $("#postModal").classList.add("flex");
      document.body.style.overflow = "hidden";
      if (!id.startsWith("sample-")) history.replaceState(null, "", `${location.pathname}${location.search}#post-${id}`);
    }

    function closePostModal() {
      $("#postModal").classList.add("hidden");
      $("#postModal").classList.remove("flex");
      document.body.style.overflow = "";
      if (location.hash.startsWith("#post-")) history.replaceState(null, "", `${location.pathname}${location.search}#blog`);
    }

    $("#blogGrid").addEventListener("click", (e) => {
      const b = e.target.closest(".open-post");
      if (b) openPostModal(b.dataset.post);
    });
    $("#postModalClose").addEventListener("click", closePostModal);
    $("#postModalCta").addEventListener("click", closePostModal);
    $("#postModal").addEventListener("click", (e) => {
      if (e.target.id === "postModal") closePostModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !$("#postModal").classList.contains("hidden")) closePostModal();
    });

    // Tải bài admin đã đăng; link dạng #post-<id> mở thẳng bài đó
    async function loadPosts() {
      if (IS_DEMO) return;
      try {
        const res = await fetch(CONFIG.POSTS_API);
        if (!res.ok) return;
        remotePosts = (await res.json()).posts || [];
        renderBlog();
        const m = location.hash.match(/^#post-(.+)$/);
        if (m) openPostModal(m[1]);
      } catch (err) {
        console.error(err);
      }
    }

    function setLang(next) {
      lang = I18N[next] ? next : "vi";
      T = I18N[lang];

      document.documentElement.lang = T.htmlLang;
      document.title = T.meta.title;
      document.querySelector('meta[name="description"]').setAttribute("content", T.meta.desc);

      $$("[data-i18n]").forEach((el) => (el.textContent = get(T, el.dataset.i18n) ?? ""));
      $$("[data-i18n-html]").forEach((el) => (el.innerHTML = get(T, el.dataset.i18nHtml) ?? ""));
      $$("[data-i18n-placeholder]").forEach((el) => el.setAttribute("placeholder", get(T, el.dataset.i18nPlaceholder) ?? ""));
      $$("[data-i18n-alt]").forEach((el) => el.setAttribute("alt", get(T, el.dataset.i18nAlt) ?? ""));

      renderLists();
      updateMenuLabel();
      clearErrors();

      $$(".lang-btn").forEach((b) => {
        const active = b.dataset.lang === lang;
        b.classList.toggle("active", active);
        b.setAttribute("aria-pressed", active);
      });

      try { localStorage.setItem("fitcoach-lang", lang); } catch (e) {}
      // Ghi ?lang= lên URL để gửi link đúng ngôn ngữ (một số trình duyệt chặn khi mở file trực tiếp)
      try {
        const url = new URL(location.href);
        url.searchParams.set("lang", lang);
        history.replaceState(null, "", url);
      } catch (e) {}
    }

    $$(".lang-btn").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));

    /* ============================ NAVBAR ============================ */
    const navbar = $("#navbar");
    const menu = $("#mobileMenu");
    const menuBtn = $("#menuBtn");
    let menuOpen = false;

    function updateMenuLabel() {
      menuBtn.setAttribute("aria-label", menuOpen ? T.nav.close : T.nav.open);
    }
    const setMenu = (open) => {
      menuOpen = open;
      menu.classList.toggle("max-h-0", !open);
      menu.classList.toggle("max-h-[32rem]", open);
      menu.classList.toggle("border-gray-100", open);
      $("#iconMenu").classList.toggle("hidden", open);
      $("#iconClose").classList.toggle("hidden", !open);
      menuBtn.setAttribute("aria-expanded", open);
      updateMenuLabel();
    };

    menuBtn.addEventListener("click", () => setMenu(!menuOpen));
    $$(".mobile-link, .close-menu").forEach((a) => a.addEventListener("click", () => setMenu(false)));

    // Đổ bóng khi cuộn
    const onScroll = () => navbar.classList.toggle("shadow-md", window.scrollY > 44);
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();

    // Gạch chân xanh dưới mục menu của section đang xem
    const spyLinks = $$("[data-spy]");
    const spy = new IntersectionObserver(
      (entries) => {
        entries.forEach((en) => {
          if (!en.isIntersecting) return;
          spyLinks.forEach((a) => a.classList.toggle("active", a.dataset.spy === en.target.id));
        });
      },
      { rootMargin: "-45% 0px -50% 0px" },
    );
    spyLinks.forEach((a) => {
      const sec = document.getElementById(a.dataset.spy);
      if (sec) spy.observe(sec);
    });

    /* ============================ HERO SLIDER ============================ */
    let currentSlide = 0;
    let slideTimer;

    function showSlide(i) {
      const slides = $$("#heroSlides .slide");
      if (!slides.length) return;
      currentSlide = (i + slides.length) % slides.length;
      slides.forEach((s, k) => {
        const on = k === currentSlide;
        s.classList.toggle("opacity-0", !on);
        s.classList.toggle("pointer-events-none", !on);
        s.setAttribute("aria-hidden", !on);
        s.querySelectorAll("a").forEach((a) => (on ? a.removeAttribute("tabindex") : a.setAttribute("tabindex", "-1")));
      });
      $("#heroDots").innerHTML = [...slides]
        .map((_, k) => `<button type="button" data-dot="${k}" aria-label="Slide ${k + 1}" class="h-2.5 w-2.5 rounded-full border border-white transition ${k === currentSlide ? "bg-white" : "bg-white/30 hover:bg-white/60"}"></button>`)
        .join("");
    }

    // Tự chuyển slide mỗi 6 giây (tắt nếu người dùng bật "giảm chuyển động")
    function startSlider() {
      clearInterval(slideTimer);
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      slideTimer = setInterval(() => showSlide(currentSlide + 1), 6000);
    }

    $("#heroDots").addEventListener("click", (e) => {
      const dot = e.target.closest("[data-dot]");
      if (!dot) return;
      showSlide(Number(dot.dataset.dot));
      startSlider();
    });

    /* ============================ STORY SLIDER ============================ */
    let currentStory = 0;

    function showStory(i) {
      const stories = $$("#storySlides .story");
      if (!stories.length) return;
      currentStory = (i + stories.length) % stories.length;
      stories.forEach((s, k) => {
        const on = k === currentStory;
        s.classList.toggle("opacity-0", !on);
        s.classList.toggle("pointer-events-none", !on);
        s.setAttribute("aria-hidden", !on);
      });
      $("#storyDots").innerHTML = [...stories]
        .map((_, k) => `<button type="button" data-story="${k}" aria-label="${k + 1}" class="h-2.5 w-2.5 rounded-full transition ${k === currentStory ? "bg-primary" : "bg-gray-300 hover:bg-gray-400"}"></button>`)
        .join("");
      $("#storyPrev").setAttribute("aria-label", T.stories.prev);
      $("#storyNext").setAttribute("aria-label", T.stories.next);
    }

    $("#storyPrev").addEventListener("click", () => showStory(currentStory - 1));
    $("#storyNext").addEventListener("click", () => showStory(currentStory + 1));
    $("#storyDots").addEventListener("click", (e) => {
      const dot = e.target.closest("[data-story]");
      if (dot) showStory(Number(dot.dataset.story));
    });

    /* ============================ FORM ============================ */
    const form = $("#leadForm");
    // Liên hệ online: email, link Facebook hoặc Telegram (@username / t.me/...)
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
    const FB_RE = /(facebook\.com|fb\.com|fb\.me|m\.me)\/\S+/i;
    const TG_RE = /^@[A-Za-z0-9_]{5,32}$|t\.me\/\S+/i;

    const showError = (field, msg) => {
      const input = form.elements[field];
      const el = form.querySelector(`[data-error="${field}"]`);
      input.classList.toggle("invalid", !!msg);
      input.setAttribute("aria-invalid", !!msg);
      el.textContent = msg || "";
      el.classList.toggle("hidden", !msg);
    };
    // Tuổi / chiều cao / cân nặng: 1 dòng báo lỗi chung, viền đỏ ô sai
    function showBodyError(bad = {}) {
      ["age", "height", "weight"].forEach((k) => {
        form.elements[k].classList.toggle("invalid", !!bad[k]);
        form.elements[k].setAttribute("aria-invalid", !!bad[k]);
      });
      const any = Object.values(bad).some(Boolean);
      $("#bodyError").textContent = any ? T.form.errBody : "";
      $("#bodyError").classList.toggle("hidden", !any);
    }
    function clearErrors() {
      showError("name", "");
      showError("contact", "");
      showBodyError();
      $("#formError").classList.add("hidden");
    }

    // Gửi đăng ký về api/lead.js -> server báo Telegram cho Coach
    const sendLead = async (lead) => {
      if (IS_DEMO) {
        console.log("[DEMO] Lead nhận được (chưa gửi đi):", lead);
        await new Promise((r) => setTimeout(r, 600));
        return;
      }
      const res = await fetch(CONFIG.LEAD_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(lead),
      });
      if (!res.ok) throw new Error("Lead API " + res.status);
    };

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      if (fd.get("website")) return; // bot

      const planIdx = PLANS.findIndex((p) => p.id === fd.get("plan"));
      const goalIdx = Number(fd.get("goal"));
      const num = (k) => parseFloat(String(fd.get(k)).replace(",", "."));
      const lead = {
        name: String(fd.get("name")).trim(),
        contact: String(fd.get("contact")).trim(),
        sex: fd.get("sex"),
        age: num("age"),
        height: num("height"),
        weight: num("weight"),
        target: num("target") || null,
        activity: num("activity"),
        // Mục tiêu & gói gửi đi bằng tiếng Việt để Coach dễ đọc
        goalIdx,
        goal: I18N.vi.form.goals[goalIdx],
        plan: planIdx >= 0 ? I18N.vi.pricing.plans[planIdx].name : "",
        note: String(fd.get("note")).trim(),
        lang,
      };

      const nameErr = lead.name.length < 2 ? T.form.errName : "";
      const contactErr = EMAIL_RE.test(lead.contact) || FB_RE.test(lead.contact) || TG_RE.test(lead.contact) ? "" : T.form.errContact;
      const bodyBad = {
        age: !(lead.age >= 14 && lead.age <= 90),
        height: !(lead.height >= 120 && lead.height <= 230),
        weight: !(lead.weight >= 30 && lead.weight <= 250),
      };
      showError("name", nameErr);
      showError("contact", contactErr);
      showBodyError(bodyBad);
      if (nameErr || contactErr || Object.values(bodyBad).some(Boolean)) return;

      const btn = $("#submitBtn");
      const errBox = $("#formError");
      btn.disabled = true;
      btn.textContent = T.form.sending;
      errBox.classList.add("hidden");

      try {
        await sendLead(lead);
        form.reset();
        form.classList.add("hidden");
        $("#formSuccess").classList.remove("hidden");
      } catch (err) {
        console.error(err);
        errBox.textContent = T.form.errSend;
        errBox.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.textContent = T.form.submit;
      }
    });

    $("#resetForm").addEventListener("click", () => {
      $("#formSuccess").classList.add("hidden");
      form.classList.remove("hidden");
    });

    /* ============================ KHỞI ĐỘNG ============================ */
    // Ưu tiên: ?lang=en trên URL > lựa chọn lần trước > ngôn ngữ trình duyệt > mặc định
    function detectLang() {
      const fromUrl = new URLSearchParams(location.search).get("lang");
      if (I18N[fromUrl]) return fromUrl;
      try {
        const saved = localStorage.getItem("fitcoach-lang");
        if (I18N[saved]) return saved;
      } catch (e) {}
      const nav = (navigator.language || "").toLowerCase();
      if (nav.startsWith("zh")) return "zh";
      if (nav.startsWith("en")) return "en";
      return CONFIG.DEFAULT_LANG;
    }

    $("#year").textContent = new Date().getFullYear();
    setLang(detectLang());
    startSlider();
    loadPosts();
  </script>
</body>
</html>
